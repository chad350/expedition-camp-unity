# 테이블 검사 기준입니다. 표 이름은 CSV 파일 이름과 같습니다.

prob_total: 10000

required:
  monster: [monster_id, name_key, base_hp, base_atk, drop_group_id, icon_path]
  item: [item_id, name_key, item_type, icon_path]
  stage: [stage_id, name_key, scene_name]
  shop: [shop_slot_id, item_id, price, currency_item_id, sort_order]
  field_object: [stage_id, spawn_point_key, wave_no, monster_id, count]
  string: [key, ko]

integer:
  monster: [monster_id, base_hp, base_atk, base_def, drop_group_id]
  item: [item_id, max_stack, sell_price]
  drop_group: [drop_group_id, seq, item_id, min_count, max_count, prob]
  stage: [stage_id, chapter, stage_no, prev_stage_id]
  shop: [shop_slot_id, item_id, price, currency_item_id, sort_order]
  field_object: [stage_id, wave_no, monster_id, count]

unique:
  - {table: monster, columns: [monster_id]}
  - {table: item, columns: [item_id]}
  - {table: stage, columns: [stage_id]}
  - {table: string, columns: [key]}
  - {table: shop, columns: [shop_slot_id]}
  - {table: shop, columns: [sort_order]}
  - {table: drop_group, columns: [drop_group_id, seq]}

ranges:
  - {table: monster, column: base_hp, min: 1, max: null}
  - {table: monster, column: base_atk, min: 1, max: null}
  - {table: shop, column: price, min: 1, max: null}
  - {table: field_object, column: count, min: 1, max: 10}
  - {table: field_object, column: wave_no, min: 1, max: 10}

references:
  - {table: monster, column: drop_group_id, target: drop_group, target_column: drop_group_id, ignore: []}
  - {table: monster, column: name_key, target: string, target_column: key, ignore: []}
  - {table: item, column: name_key, target: string, target_column: key, ignore: []}
  - {table: drop_group, column: item_id, target: item, target_column: item_id, ignore: []}
  - {table: shop, column: item_id, target: item, target_column: item_id, ignore: []}
  - {table: shop, column: currency_item_id, target: item, target_column: item_id, ignore: []}
  - {table: field_object, column: stage_id, target: stage, target_column: stage_id, ignore: []}
  - {table: field_object, column: monster_id, target: monster, target_column: monster_id, ignore: []}
  - {table: stage, column: prev_stage_id, target: stage, target_column: stage_id, ignore: ["0"]}
