# 프리팹 규칙입니다. 기준은 docs/값의_출처표.md 3절입니다.

plain:
  Assets/Prefabs/Player.prefab:
    tag: Player
    layer: Player
    children_same_layer: true
    script_values:
      PlayerController: {moveSpeed: 5, attackInterval: 0.6, attackRange: 2.2}
  Assets/Prefabs/Monster_Base.prefab:
    tag: Monster
    layer: Monster
    children_same_layer: true
    script_values:
      Monster: {moveSpeed: 2, attackRange: 1.6, attackInterval: 1.5, hpBarHeight: 2.4}
  Assets/Prefabs/DropItem.prefab:
    tag: DropItem
    layer: DropItem
    children_same_layer: true
    is_trigger: true

variants:
  allowed_overrides: [m_Name, moveSpeed, prefabKey, m_Sprite, shape, bodyMaterial, hpBarHeight, m_LocalScale, m_LocalPosition, m_LocalRotation, m_LocalEulerAnglesHint]
  files:
    - Assets/Resources/Monsters/Monster_Crab.prefab
    - Assets/Resources/Monsters/Monster_Rabbit.prefab
    - Assets/Resources/Monsters/Monster_Bat.prefab
    - Assets/Resources/Monsters/Monster_Golem.prefab
    - Assets/Resources/Monsters/Monster_Wolf.prefab
